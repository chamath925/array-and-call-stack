<!DOCTYPE html>
<html>

<body>
    <h2>Java script array methods</h2>
    <h2>join() and pop()</h2>
    <p>The join element joins array into string and the pop element removes the last element from the array</p>
    <p id="myJoin"></p>
    <p id="myFirstPop"></p>
    <p id="mySecondPop"></p>
    <script>
        var fruits = ["Apple", "Banana", "Orange", "Mango"];
        document.getElementById("myJoin").innerHTML = fruits.join(" ");
        document.getElementById("myFirstPop").innerHTML = fruits.pop();
        document.getElementById("mySecondPop").innerHTML = fruits.pop();
    </script>
</body>

</html>
